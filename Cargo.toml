[package]
name = "apogee"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "apogee"
test = true
bench = false

[[test]]
name = "basic_boot"

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "fault_recovery_pf"
harness = false

[[test]]
name = "fault_recovery_gpf"
harness = false

[[test]]
name = "heap_allocation"

[[test]]
name = "async_tasks"

[[test]]
name = "runtime_observability"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
run-args  = ["-serial", "stdio", "--no-reboot"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
    "--no-reboot",
]
test-success-exit-code = 33          # (0x10 << 1) | 1
test-timeout = 300

[dependencies]
bootloader  = {version="0.9", features = ["map_physical_memory"]}
volatile    = "0.2.6"
spin        = "0.5.2"
uart_16550  = "0.2"
x86_64      = "0.14.2"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"

[dependencies.lazy_static]
version  = "1.0"
features = ["spin_no_std"]

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]
